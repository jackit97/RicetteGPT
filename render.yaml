services:
  - type: web
    name: ricettegpt-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_IMAGES_MODEL
        value: gpt-image-1
      - key: OPENAI_GENERATE_DISH_IMAGE
        value: "0"
      - key: DB_AUTO_MIGRATE
        value: "1"
      # Set OPENAI_API_KEY in Render dashboard (secret)
      # DATABASE_URL is injected from the database below
      - key: DATABASE_URL
        fromDatabase:
          name: ricettegpt-db
          property: connectionString

databases:
  - name: ricettegpt-db
    plan: free
